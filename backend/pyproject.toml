[project]
name = "timetable-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic-settings>=2.4",
  "pyjwt[crypto]>=2.9",
  "httpx>=0.27",
  "icalendar>=6.0",
  "cryptography>=43",
  "tzdata>=2024.1",
]

[dependency-groups]
dev = ["pytest>=8", "uvicorn>=0.30"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
